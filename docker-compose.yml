version: "3.8"

services:
  xai-api:
    image: xai-automl:lite
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_AUTOML: "false"
    container_name: xai-predictive-maintenance-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SERVED_MODEL_PREFERENCE=auto
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - xai-net

networks:
  xai-net:
    driver: bridge
