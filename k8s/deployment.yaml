apiVersion: apps/v1
kind: Deployment
metadata:
  name: xai-api
  namespace: xai-predictive-maintenance
  labels:
    app: xai-api
    tier: backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xai-api
      tier: backend
  template:
    metadata:
      labels:
        app: xai-api
        tier: backend
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: xai-api
          image: xai-automl:lite
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: xai-config
            - secretRef:
                name: xai-secret
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem is false because the application dynamically renders
            # and persists localized SHAP and LIME matplotlib plots into /app/artifacts/xai/local/
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
